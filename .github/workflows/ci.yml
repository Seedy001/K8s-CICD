name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/deployment.yaml'
      - '**.md'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: k8s-cicd
  OWNER: seedy001

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest

  bump-manifest:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump image tag in deployment.yaml
        env:
          TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          sed -i "s|image: ghcr.io/seedy001/k8s-cicd:.*|image: ghcr.io/seedy001/k8s-cicd:${TAG}|" k8s/deployment.yaml
          echo "--- deployment.yaml après bump ---"
          grep "image:" k8s/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "Aucun changement à commit"
            exit 0
          fi
          git commit -m "chore(deploy): bump image to ${{ needs.build-push.outputs.image_tag }} [skip ci]"
          git push
